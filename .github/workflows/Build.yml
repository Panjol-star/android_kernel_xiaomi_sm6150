name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Pilih Codename Device'
        required: true
        default: 'courbet'
        type: choice
        options:
          - sweet
          - courbet
          - tucana
          - toco
          - phoenix
          - davinci
      localversion:
        description: 'KBUILD_LOCALVERSION (contoh: -Custom)'
        required: false
        default: '-Custom'
        type: string
jobs:
  build:
    name: Build Custom Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Wajib agar GitHub Actions diizinkan membuat Release
    env:
      TZ: Asia/Jakarta

    steps:
      - name: Set Timezone to WIB
        run: |
          sudo timedatectl set-timezone Asia/Jakarta
          date

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt install -y bc bison build-essential ccache curl erofs-utils flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick kmod protobuf-compiler python3-protobuf lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc xxd zip zlib1g-dev
            
      - name: Setup Clang
        run: |
          echo "Cloning Clang..."
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r563880c.git clang
          clang/bin/clang --version

      - name: Compile Kernel
        env:
          DEVICE: ${{ github.event.inputs.device }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          name: Kernel for ${{ github.event.inputs.device }}
          tag_name: ${{ github.event.inputs.device }}-${{ github.run_id }}
          body: |
            **Kernel Build Completed**
            - **Device:** ${{ github.event.inputs.device }}
            

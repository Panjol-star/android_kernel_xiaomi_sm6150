name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Pilih Codename Device'
        required: true
        default: 'courbet'
        type: choice
        options:
          - sweet
          - courbet
          - tucana
          - toco
          - phoenix
          - davinci
      localversion:
        description: 'KBUILD_LOCALVERSION (contoh: -Custom)'
        required: false
        default: '-Custom'
        type: string
jobs:
  build:
    name: Build Custom Kernel
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Wajib agar GitHub Actions diizinkan membuat Release
    env:
      TZ: Asia/Jakarta

    steps:
      - name: Set Timezone to WIB
        run: |
          sudo timedatectl set-timezone Asia/Jakarta
          date

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache curl flex \
            git kmod libdw-dev libelf-dev libssl-dev lz4 \
            python3 rsync xxd zip zlib1g-dev zstd

      - name: Setup Neutron Clang
        run: |
          aria2c -x 16 -s 16 -k 1M --file-allocation=none --console-log-level=warn \
            "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst" \
            -o neutron-clang.tar.zst
          mkdir -p clang
          tar --use-compress-program="zstd -d -T0" -xf neutron-clang.tar.zst -C clang
          rm -f neutron-clang.tar.zst
          clang/bin/clang --version

      - name: Compile Kernel
        env:
           DEVICE: ${{ github.event.inputs.device }}
           KBUILD_LOCALVERSION: ${{ github.event.inputs.localversion }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          name: Kernel for ${{ github.event.inputs.device }}
          tag_name: ${{ github.event.inputs.device }}-${{ github.run_id }}
          body: |
            **Kernel Build Completed**
            - **Device:** ${{ github.event.inputs.device }}
            
